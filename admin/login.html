<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — 804 AVENUE Properties &amp; Contracting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg-deep:#04060C;--bg-surface:#0C1222;--bg-card:#111B2E;--bg-elevated:#182039;--bg-glass:rgba(12,18,34,0.65);
  --success:#10B981;--warning:#F59E0B;--danger:#EF4444;
  --text-primary:#F1F5F9;--text-secondary:#94A3B8;--text-tertiary:#64748B;--text-inverse:#04060C;
  --radius:12px;
}
html,body{height:100%;font-family:'Inter',sans-serif;background:var(--bg-deep);color:var(--text-primary);-webkit-font-smoothing:antialiased}

.login-wrapper{display:flex;min-height:100vh}

/* ─── LEFT PANEL ─── */
.left-panel{
  flex:1;display:flex;align-items:center;justify-content:center;
  background:var(--bg-surface);position:relative;overflow:hidden;
}
.dot-grid{
  position:absolute;inset:0;
  background-image:radial-gradient(var(--accent-10) 1px,transparent 1px);
  background-size:28px 28px;
  pointer-events:none;
}
.radial-glow{
  position:absolute;width:420px;height:420px;
  background:radial-gradient(circle,var(--accent-15) 0%,transparent 70%);
  border-radius:50%;pointer-events:none;
}
.brand-block{position:relative;z-index:2;text-align:center;padding:40px}
.brand-icon{margin:0 auto 28px}
.brand-title{display:flex;align-items:baseline;justify-content:center;gap:8px;margin-bottom:6px}
.brand-title .t804{font-family:'Syne',sans-serif;font-weight:800;font-size:3rem;color:#fff;letter-spacing:-1px}
.brand-title .tavenue{font-family:'Syne',sans-serif;font-weight:700;font-size:3rem;color:var(--accent);letter-spacing:-1px}
.brand-subtitle{font-family:'Syne',sans-serif;font-weight:600;font-size:.75rem;letter-spacing:4px;text-transform:uppercase;color:var(--text-secondary);margin-bottom:18px}
.brand-tagline{font-family:'Syne',sans-serif;font-size:.95rem;color:var(--accent);opacity:.85}

/* ─── RIGHT PANEL ─── */
.right-panel{
  flex:1;display:flex;align-items:center;justify-content:center;
  background:var(--bg-card);position:relative;
}
.login-card{width:100%;max-width:400px;padding:40px}
.login-card h1{font-family:'Space Grotesk',sans-serif;font-size:1.85rem;font-weight:700;margin-bottom:6px}
.login-card .sub{color:var(--text-secondary);font-size:.9rem;margin-bottom:32px}

.field{margin-bottom:20px}
.field label{display:block;font-family:'Syne',sans-serif;font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-secondary);margin-bottom:8px}
.input-wrap{position:relative}
.input-wrap input{
  width:100%;padding:13px 16px;
  background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius);
  color:var(--text-primary);font-family:'Inter',sans-serif;font-size:.95rem;
  outline:none;transition:border .25s,box-shadow .25s;
}
.input-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-15)}
.input-wrap input::placeholder{color:var(--text-tertiary)}
.toggle-pw{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;color:var(--text-tertiary);padding:0;display:flex;
  transition:color .2s;
}
.toggle-pw:hover{color:var(--text-primary)}
.toggle-pw svg{width:20px;height:20px}

.btn-login{
  width:100%;padding:14px;border:none;border-radius:var(--radius);cursor:pointer;
  font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;letter-spacing:.5px;
  background:var(--accent);color:#fff;
  box-shadow:0 0 24px var(--accent-glow);
  transition:background .25s,box-shadow .25s,transform .15s;
}
.btn-login:hover{background:var(--accent-hover);box-shadow:0 0 32px var(--accent-glow);transform:translateY(-1px)}
.btn-login:active{transform:translateY(0)}

.forgot{display:block;text-align:center;margin-top:18px;color:var(--accent);font-size:.85rem;text-decoration:none;transition:color .2s}
.forgot:hover{color:var(--cyan)}

.demo-creds{
  margin-top:28px;padding:14px 16px;border-radius:var(--radius);
  background:var(--accent-10);border:1px dashed var(--border-active);
}
.demo-creds p{font-size:.78rem;color:var(--text-tertiary);line-height:1.6}
.demo-creds span{color:var(--text-secondary);font-family:'Space Grotesk',sans-serif;font-weight:600}

.error-msg{
  display:none;padding:10px 14px;border-radius:8px;margin-bottom:16px;
  background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);
  color:var(--danger);font-size:.85rem;
}
.error-msg.show{display:flex;align-items:center;gap:8px}

/* ─── MOBILE ─── */
@media(max-width:860px){
  .login-wrapper{flex-direction:column}
  .left-panel{min-height:260px;flex:none}
  .brand-title .t804,.brand-title .tavenue{font-size:2.2rem}
  .radial-glow{width:260px;height:260px}
  .right-panel{flex:1}
  .login-card{padding:32px 24px}
}
</style>
</head>
<body>
<div class="login-wrapper">

  <!-- LEFT PANEL -->
  <div class="left-panel">
    <div class="dot-grid"></div>
    <div class="radial-glow"></div>
    <div class="brand-block">
      <div class="brand-icon">
        <svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="10" y="24" width="20" height="38" rx="2" style="stroke:var(--accent);fill:var(--accent-10)" stroke-width="2"/>
          <rect x="14" y="30" width="5" height="5" rx="1" style="fill:var(--accent-glow)"/>
          <rect x="21" y="30" width="5" height="5" rx="1" style="fill:var(--accent-glow)"/>
          <rect x="14" y="38" width="5" height="5" rx="1" style="fill:var(--accent-glow)"/>
          <rect x="21" y="38" width="5" height="5" rx="1" style="fill:var(--accent-glow)"/>
          <rect x="14" y="46" width="5" height="5" rx="1" style="fill:var(--accent-glow)"/>
          <rect x="21" y="46" width="5" height="5" rx="1" style="fill:var(--accent-glow)"/>
          <rect x="16" y="54" width="8" height="8" rx="1" style="fill:var(--accent-20);stroke:var(--accent)" stroke-width="1"/>
          <rect x="34" y="14" width="28" height="48" rx="2" style="stroke:var(--accent);fill:var(--accent-10)" stroke-width="2"/>
          <rect x="38" y="20" width="6" height="6" rx="1" style="fill:var(--accent-glow)"/>
          <rect x="47" y="20" width="6" height="6" rx="1" style="fill:var(--accent-glow)"/>
          <rect x="38" y="30" width="6" height="6" rx="1" style="fill:var(--accent-glow)"/>
          <rect x="47" y="30" width="6" height="6" rx="1" style="fill:var(--accent-glow)"/>
          <rect x="38" y="40" width="6" height="6" rx="1" style="fill:var(--accent-glow)"/>
          <rect x="47" y="40" width="6" height="6" rx="1" style="fill:var(--accent-glow)"/>
          <rect x="43" y="50" width="10" height="12" rx="1" style="fill:var(--accent-20);stroke:var(--accent)" stroke-width="1"/>
          <line x1="36" y1="8" x2="36" y2="14" style="stroke:var(--accent)" stroke-width="2" stroke-linecap="round"/>
          <circle cx="36" cy="6" r="2" style="fill:var(--accent)" opacity="0.6"/>
        </svg>
      </div>
      <div class="brand-title">
        <span class="t804">804</span>
        <span class="tavenue">AVENUE</span>
      </div>
      <div class="brand-subtitle">Properties &amp; Contracting</div>
      <div class="brand-tagline">Delivering Excellence &amp; Trust</div>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel">
    <div class="login-card">
      <h1>Admin Login</h1>
      <p class="sub">Sign in to your admin dashboard</p>

      <div class="error-msg" id="errorMsg">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5"/><line x1="8" y1="4.5" x2="8" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="11.5" r=".9" fill="currentColor"/></svg>
        <span id="errorText">Invalid credentials</span>
      </div>

      <form id="loginForm" autocomplete="off">
        <div class="field">
          <label>Email Address</label>
          <div class="input-wrap">
            <input type="email" id="email" placeholder="admin@804avenue.com" required>
          </div>
        </div>
        <div class="field">
          <label>Password</label>
          <div class="input-wrap">
            <input type="password" id="password" placeholder="Enter password" required>
            <button type="button" class="toggle-pw" id="togglePw" aria-label="Toggle password visibility">
              <svg id="eyeOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg id="eyeClosed" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-login">Login</button>
      </form>

      <a href="#" class="forgot">Forgot password?</a>

      <div class="demo-creds">
        <p>Demo credentials:<br><span>admin@804avenue.com</span> / <span>admin123</span></p>
      </div>
    </div>
  </div>

</div>

<script>
const form = document.getElementById('loginForm');
const emailInput = document.getElementById('email');
const pwInput = document.getElementById('password');
const toggleBtn = document.getElementById('togglePw');
const eyeOpen = document.getElementById('eyeOpen');
const eyeClosed = document.getElementById('eyeClosed');
const errorMsg = document.getElementById('errorMsg');
const errorText = document.getElementById('errorText');

toggleBtn.addEventListener('click', () => {
  const showing = pwInput.type === 'text';
  pwInput.type = showing ? 'password' : 'text';
  eyeOpen.style.display = showing ? '' : 'none';
  eyeClosed.style.display = showing ? 'none' : '';
});

form.addEventListener('submit', (e) => {
  e.preventDefault();
  errorMsg.classList.remove('show');

  const email = emailInput.value.trim();
  const pw = pwInput.value;

  if (!email) { showError('Please enter your email address.'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showError('Please enter a valid email address.'); return; }
  if (!pw) { showError('Please enter your password.'); return; }

  if (email === 'admin@804avenue.com' && pw === 'admin123') {
    sessionStorage.setItem('804_admin_auth', 'true');
    window.location.href = 'index.html';
  } else {
    showError('Invalid email or password. Try the demo credentials.');
  }
});

function showError(msg) {
  errorText.textContent = msg;
  errorMsg.classList.add('show');
}
</script>
</body>
</html>
