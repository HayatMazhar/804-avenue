<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>General Settings — 804 AVENUE Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg-deep);color:var(--text-primary);min-height:100vh;display:flex}
a{text-decoration:none;color:inherit}
button{cursor:pointer;font-family:inherit;border:none;outline:none}
input,select,textarea{font-family:inherit;outline:none}

.sidebar{width:var(--sidebar-w);height:100vh;position:fixed;top:0;left:0;background:var(--bg-surface);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:100;transition:transform .3s ease}
.sidebar-logo{padding:28px 24px;border-bottom:1px solid var(--border)}
.sidebar-logo h1{font-family:'Syne',sans-serif;font-size:1.35rem;font-weight:800;letter-spacing:2px;background:linear-gradient(135deg,var(--accent),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sidebar-logo span{display:block;font-family:'Inter',sans-serif;font-size:.65rem;color:var(--text-tertiary);letter-spacing:3px;text-transform:uppercase;margin-top:4px;font-weight:500}
.sidebar-nav{flex:1;padding:16px 12px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 16px;border-radius:10px;color:var(--text-secondary);font-size:.875rem;font-weight:500;margin-bottom:4px;transition:all .2s ease}
.nav-item:hover{color:var(--text-primary);background:var(--bg-card)}
.nav-item.active{color:#fff;background:linear-gradient(135deg,var(--accent-20),var(--cyan-glow));border:1px solid var(--border-hover)}
.nav-item svg{width:20px;height:20px;flex-shrink:0}
.sidebar-footer{padding:16px 12px;border-top:1px solid var(--border)}
.nav-item.logout:hover{color:var(--danger)}

.main{margin-left:var(--sidebar-w);flex:1;padding:32px;min-height:100vh;max-width:900px}

.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:16px}
.page-title{font-family:'Space Grotesk',sans-serif;font-size:1.75rem;font-weight:700;letter-spacing:-.5px}
.hamburger{display:none;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text-primary)}
.hamburger svg{width:22px;height:22px}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90}

.card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:28px;margin-bottom:24px}
.card-title{font-family:'Space Grotesk',sans-serif;font-size:1.1rem;font-weight:600;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.form-group{display:flex;flex-direction:column}
.form-group.full{grid-column:1/-1}
.form-group label{font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-tertiary);font-weight:600;margin-bottom:6px}
.input-field,textarea{width:100%;padding:10px 14px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);font-size:.85rem;transition:border-color .2s}
.input-field:focus,textarea:focus{border-color:var(--border-hover)}
textarea{resize:vertical;min-height:90px}

.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:8px;font-size:.85rem;font-weight:600;transition:all .2s ease}
.btn-accent{background:var(--accent);color:#fff}.btn-accent:hover{background:var(--accent-hover)}
.btn-lg{padding:13px 32px;font-size:.9rem}

.toast{position:fixed;bottom:24px;right:24px;background:var(--bg-elevated);border:1px solid var(--success-glow);border-radius:10px;padding:14px 22px;font-size:.85rem;color:var(--success);box-shadow:0 8px 32px rgba(0,0,0,.4);transform:translateY(100px);opacity:0;transition:all .35s ease;z-index:500;display:flex;align-items:center;gap:8px}
.toast.show{transform:translateY(0);opacity:1}

@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .overlay.show{display:block}
  .main{margin-left:0;padding:20px 16px}
  .hamburger{display:flex}
  .page-title{font-size:1.3rem}
  .form-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <h1>804 AVENUE</h1>
    <span>Admin Dashboard</span>
  </div>
  <nav class="sidebar-nav">
    <a href="../index.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Dashboard
    </a>
    <a href="../properties/list.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      Properties
    </a>
    <a href="../projects/list.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h20"/><path d="M5 20V10l7-5 7 5v10"/><path d="M9 20v-6h6v6"/></svg>
      Projects
    </a>
    <a href="../inquiries/list.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      Inquiries
    </a>
    <a href="general.html" class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      Settings
    </a>
    <a href="team.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
      Team
    </a>
  </nav>
  <div class="sidebar-footer">
    <a href="../login.html" class="nav-item logout">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Logout
    </a>
  </div>
</aside>

<main class="main">
  <div class="page-header">
    <div style="display:flex;align-items:center;gap:14px">
      <button class="hamburger" onclick="toggleSidebar()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <h1 class="page-title">General Settings</h1>
    </div>
  </div>

  <!-- Company Information -->
  <div class="card">
    <div class="card-title">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h20"/><path d="M5 20V10l7-5 7 5v10"/><path d="M9 20v-6h6v6"/></svg>
      Company Information
    </div>
    <div class="form-grid">
      <div class="form-group full">
        <label>Company Name</label>
        <input type="text" class="input-field" value="804 AVENUE Real Estate & Contracting">
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="text" class="input-field" value="+971 50 43 99 804">
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" class="input-field" value="info@804avenue.com">
      </div>
      <div class="form-group full">
        <label>Address</label>
        <input type="text" class="input-field" value="Office #540, 5th Floor, Al Ghaith Tower, Abu Dhabi, UAE">
      </div>
      <div class="form-group">
        <label>Website</label>
        <input type="url" class="input-field" value="www.804avenue.ae">
      </div>
      <div class="form-group">
        <label>Working Hours</label>
        <input type="text" class="input-field" value="Mon-Sat 9AM-6PM">
      </div>
    </div>
  </div>

  <!-- Social Media -->
  <div class="card">
    <div class="card-title">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 011-1h3z"/></svg>
      Social Media
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label>Facebook URL</label>
        <input type="url" class="input-field" placeholder="https://facebook.com/804avenue">
      </div>
      <div class="form-group">
        <label>Instagram URL</label>
        <input type="url" class="input-field" placeholder="https://instagram.com/804avenue">
      </div>
      <div class="form-group">
        <label>LinkedIn URL</label>
        <input type="url" class="input-field" placeholder="https://linkedin.com/company/804avenue">
      </div>
      <div class="form-group">
        <label>X (Twitter) URL</label>
        <input type="url" class="input-field" placeholder="https://x.com/804avenue">
      </div>
    </div>
  </div>

  <!-- SEO Settings -->
  <div class="card">
    <div class="card-title">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      SEO Settings
    </div>
    <div class="form-grid">
      <div class="form-group full">
        <label>Meta Title</label>
        <input type="text" class="input-field" value="804 AVENUE — Premium Real Estate & Contracting in Abu Dhabi">
      </div>
      <div class="form-group full">
        <label>Meta Description</label>
        <textarea>804 AVENUE offers premium real estate services, property management, interior design, and contracting solutions in Abu Dhabi, UAE. Your trusted partner for luxury living and quality construction.</textarea>
      </div>
    </div>
  </div>

  <!-- Save -->
  <div style="text-align:right;margin-top:8px">
    <button class="btn btn-accent btn-lg" onclick="saveSettings()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      Save Settings
    </button>
  </div>
</main>

<div class="toast" id="toast">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
  <span id="toastMsg">Settings saved successfully</span>
</div>

<script>
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('show')}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show')}

function saveSettings(){
  const t=document.getElementById('toast');
  document.getElementById('toastMsg').textContent='Settings saved successfully';
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}
</script>
</body>
</html>
