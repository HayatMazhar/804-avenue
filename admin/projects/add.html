<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Project — 804 AVENUE Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg-deep:#04060C;--bg-surface:#0C1222;--bg-card:#111B2E;
  --success:#10B981;--danger:#EF4444;
  --text-primary:#F1F5F9;--text-secondary:#94A3B8;--text-tertiary:#64748B;
  --sidebar-w:260px;
  --font-heading:'Syne',sans-serif;--font-body:'Space Grotesk',sans-serif;--font-ui:'Inter',sans-serif;
}
html{font-size:15px}
body{background:var(--bg-deep);color:var(--text-primary);font-family:var(--font-body);min-height:100vh;display:flex}
a{text-decoration:none;color:inherit}
button{cursor:pointer;font-family:var(--font-body);border:none;outline:none}
input,select,textarea{font-family:var(--font-body);outline:none}

/* ─── SIDEBAR ─── */
.sidebar{position:fixed;top:0;left:0;width:var(--sidebar-w);height:100vh;background:var(--bg-surface);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:100;transition:transform .3s ease}
.sidebar-logo{padding:28px 24px 24px;display:flex;align-items:center;gap:12px}
.sidebar-logo .logo-icon{width:40px;height:40px;background:linear-gradient(135deg,var(--accent),var(--cyan));border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-weight:800;font-size:16px;color:#fff}
.sidebar-logo span{font-family:var(--font-heading);font-weight:700;font-size:1.15rem;letter-spacing:1.5px;color:var(--text-primary)}
.sidebar-nav{flex:1;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.sidebar-nav a{display:flex;align-items:center;gap:12px;padding:11px 16px;border-radius:10px;font-size:.9rem;font-weight:500;color:var(--text-secondary);transition:all .2s}
.sidebar-nav a:hover{background:rgba(59,130,246,.08);color:var(--text-primary)}
.sidebar-nav a.active{background:rgba(59,130,246,.15);color:var(--accent);font-weight:600}
.sidebar-nav a svg{width:20px;height:20px;flex-shrink:0;opacity:.7}
.sidebar-nav a.active svg{opacity:1}
.nav-label{padding:8px 16px 6px;font-size:.7rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-tertiary);font-family:var(--font-ui)}
.sidebar-bottom{padding:16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:12px}
.sidebar-bottom .avatar{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--cyan));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;color:#fff}
.sidebar-bottom .user-info{flex:1}
.sidebar-bottom .user-info .name{font-size:.85rem;font-weight:600;color:var(--text-primary)}
.sidebar-bottom .user-info .role{font-size:.7rem;color:var(--text-tertiary)}
.sidebar-bottom .logout-btn{width:34px;height:34px;border-radius:8px;background:rgba(239,68,68,.1);display:flex;align-items:center;justify-content:center;transition:background .2s}
.sidebar-bottom .logout-btn:hover{background:rgba(239,68,68,.2)}
.sidebar-bottom .logout-btn svg{width:18px;height:18px;color:var(--danger)}

/* ─── MAIN ─── */
.main{margin-left:var(--sidebar-w);flex:1;padding:32px 36px;min-height:100vh}
.top-bar{display:flex;align-items:center;gap:16px;margin-bottom:28px}
.top-bar h1{font-family:var(--font-heading);font-size:1.65rem;font-weight:700;letter-spacing:.5px}
.breadcrumb{font-size:.85rem;color:var(--text-tertiary)}
.breadcrumb a{color:var(--accent)}
.breadcrumb a:hover{text-decoration:underline}

/* ─── FORM ─── */
.form-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:32px;max-width:900px}
.form-section{margin-bottom:28px}
.form-section h2{font-family:var(--font-heading);font-size:1.1rem;font-weight:700;margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid var(--border);color:var(--text-primary)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group.full{grid-column:1/-1}
.form-group label{font-size:.78rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-tertiary);font-family:var(--font-ui);font-weight:600}
.form-group input,.form-group select,.form-group textarea{background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;padding:11px 16px;color:var(--text-primary);font-size:.9rem;transition:border-color .2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.form-group select option{background:var(--bg-surface)}
.form-group textarea{resize:vertical;min-height:120px}
.form-group input::placeholder,.form-group textarea::placeholder{color:var(--text-tertiary)}

/* ─── CHECKBOXES ─── */
.checkbox-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.checkbox-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:all .2s}
.checkbox-item:hover{border-color:rgba(59,130,246,.3)}
.checkbox-item input[type="checkbox"]{display:none}
.checkbox-item .check-mark{width:20px;height:20px;border-radius:6px;border:2px solid var(--text-tertiary);display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.checkbox-item input:checked~.check-mark{background:var(--accent);border-color:var(--accent)}
.checkbox-item input:checked~.check-mark::after{content:'';display:block;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);margin-top:-2px}
.checkbox-item .check-label{font-size:.88rem;color:var(--text-secondary)}
.checkbox-item input:checked~.check-label{color:var(--text-primary)}

/* ─── UPLOAD ─── */
.upload-zone{border:2px dashed rgba(59,130,246,.25);border-radius:14px;padding:40px 24px;text-align:center;cursor:pointer;transition:all .3s;background:var(--accent-10)}
.upload-zone:hover{border-color:var(--accent);background:rgba(59,130,246,.06)}
.upload-zone.dragover{border-color:var(--accent);background:rgba(59,130,246,.1)}
.upload-zone svg{margin-bottom:12px;color:var(--accent)}
.upload-zone h4{font-size:.95rem;color:var(--text-primary);margin-bottom:4px}
.upload-zone p{font-size:.8rem;color:var(--text-tertiary)}
.upload-preview{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.upload-preview .preview-item{width:80px;height:60px;border-radius:8px;background:var(--bg-surface);border:1px solid var(--border);overflow:hidden;position:relative}
.upload-preview .preview-item img{width:100%;height:100%;object-fit:cover}
.upload-preview .preview-item .remove-btn{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--danger);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer}

/* ─── BUTTONS ─── */
.form-actions{display:flex;gap:14px;margin-top:32px;padding-top:24px;border-top:1px solid var(--border)}
.btn-primary{background:var(--accent);color:#fff;padding:12px 28px;border-radius:10px;font-size:.92rem;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:all .2s;box-shadow:0 0 20px rgba(59,130,246,.25)}
.btn-primary:hover{background:#2563EB;box-shadow:0 0 30px rgba(59,130,246,.4)}
.btn-outline{background:transparent;color:var(--text-secondary);padding:12px 28px;border-radius:10px;font-size:.92rem;font-weight:600;border:1px solid var(--border);display:inline-flex;align-items:center;gap:8px;transition:all .2s}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}

/* ─── MOBILE ─── */
.hamburger{display:none;position:fixed;top:18px;left:18px;z-index:200;width:42px;height:42px;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.hamburger span{display:block;width:20px;height:2px;background:var(--text-primary);border-radius:2px;transition:all .3s}
.overlay{display:none;position:fixed;inset:0;background:rgba(4,6,12,.7);z-index:90}

@media(max-width:1024px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .hamburger{display:flex}
  .overlay.open{display:block}
  .main{margin-left:0;padding:24px 18px;padding-top:72px}
}
@media(max-width:640px){
  .form-grid{grid-template-columns:1fr}
  .checkbox-grid{grid-template-columns:1fr}
  .form-actions{flex-direction:column}
  .form-actions button,.form-actions a{width:100%;justify-content:center}
}
</style>
</head>
<body>

<!-- Hamburger -->
<button class="hamburger" onclick="toggleSidebar()" aria-label="Menu">
  <span></span><span></span><span></span>
</button>
<div class="overlay" onclick="toggleSidebar()"></div>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">8</div>
    <span>804 AVENUE</span>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-label">Main</div>
    <a href="../index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Dashboard
    </a>
    <a href="../properties/list.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      Properties
    </a>
    <a href="list.html" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      Projects
    </a>
    <a href="../inquiries/list.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Inquiries
    </a>
    <div class="nav-label">System</div>
    <a href="../settings/general.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Settings
    </a>
    <a href="../settings/team.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Team
    </a>
  </nav>
  <div class="sidebar-bottom">
    <div class="avatar">A</div>
    <div class="user-info">
      <div class="name">Admin</div>
      <div class="role">Super Admin</div>
    </div>
    <a href="../login.html" class="logout-btn" title="Logout">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </a>
  </div>
</aside>

<!-- Main -->
<main class="main">
  <div class="top-bar">
    <div>
      <div class="breadcrumb"><a href="list.html">Projects</a> / Add New</div>
      <h1>Add New Project</h1>
    </div>
  </div>

  <form class="form-card" onsubmit="return handleSubmit(event)">
    <!-- Basic Info -->
    <div class="form-section">
      <h2>Basic Information</h2>
      <div class="form-grid">
        <div class="form-group">
          <label>Project Name</label>
          <input type="text" name="name" placeholder="e.g. Villa Construction, Abu Dhabi" required>
        </div>
        <div class="form-group">
          <label>Type</label>
          <select name="type" required>
            <option value="">Select Type</option>
            <option>Construction</option>
            <option>Renovation</option>
            <option>Interior</option>
            <option>Exterior</option>
            <option>Signage</option>
          </select>
        </div>
        <div class="form-group">
          <label>Location</label>
          <input type="text" name="location" placeholder="e.g. Abu Dhabi, UAE">
        </div>
        <div class="form-group">
          <label>Year</label>
          <select name="year">
            <option>2024</option>
            <option>2023</option>
            <option>2022</option>
          </select>
        </div>
        <div class="form-group">
          <label>Duration</label>
          <input type="text" name="duration" placeholder="e.g. 8 Months">
        </div>
        <div class="form-group">
          <label>Client</label>
          <input type="text" name="client" placeholder="e.g. Private Client">
        </div>
        <div class="form-group">
          <label>Status</label>
          <select name="status">
            <option>Completed</option>
            <option>In Progress</option>
            <option>Planning</option>
          </select>
        </div>
        <div class="form-group full">
          <label>Description</label>
          <textarea name="description" placeholder="Enter project description…"></textarea>
        </div>
      </div>
    </div>

    <!-- Services -->
    <div class="form-section">
      <h2>Services</h2>
      <div class="checkbox-grid">
        <label class="checkbox-item">
          <input type="checkbox" name="services" value="Civil Works">
          <span class="check-mark"></span>
          <span class="check-label">Civil Works</span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" name="services" value="Structural">
          <span class="check-mark"></span>
          <span class="check-label">Structural</span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" name="services" value="MEP">
          <span class="check-mark"></span>
          <span class="check-label">MEP</span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" name="services" value="Interior Design">
          <span class="check-mark"></span>
          <span class="check-label">Interior Design</span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" name="services" value="Landscaping">
          <span class="check-mark"></span>
          <span class="check-label">Landscaping</span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" name="services" value="Fit-out">
          <span class="check-mark"></span>
          <span class="check-label">Fit-out</span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" name="services" value="Signage">
          <span class="check-mark"></span>
          <span class="check-label">Signage</span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" name="services" value="Project Management">
          <span class="check-mark"></span>
          <span class="check-label">Project Management</span>
        </label>
      </div>
    </div>

    <!-- Images -->
    <div class="form-section">
      <h2>Project Images</h2>
      <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <h4>Drop images here or click to upload</h4>
        <p>PNG, JPG, WEBP up to 5MB each</p>
      </div>
      <input type="file" id="fileInput" multiple accept="image/*" style="display:none" onchange="handleFiles(this.files)">
      <div class="upload-preview" id="uploadPreview"></div>
    </div>

    <!-- Actions -->
    <div class="form-actions">
      <button type="submit" class="btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        Save Project
      </button>
      <a href="list.html" class="btn-outline">Cancel</a>
    </div>
  </form>
</main>

<script>
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.querySelector('.overlay').classList.toggle('open');
}

const uploadZone=document.getElementById('uploadZone');
uploadZone.addEventListener('dragover',e=>{e.preventDefault();uploadZone.classList.add('dragover')});
uploadZone.addEventListener('dragleave',()=>uploadZone.classList.remove('dragover'));
uploadZone.addEventListener('drop',e=>{e.preventDefault();uploadZone.classList.remove('dragover');handleFiles(e.dataTransfer.files)});

function handleFiles(files){
  const preview=document.getElementById('uploadPreview');
  Array.from(files).forEach(file=>{
    if(!file.type.startsWith('image/'))return;
    const reader=new FileReader();
    reader.onload=e=>{
      const div=document.createElement('div');
      div.className='preview-item';
      div.innerHTML=`<img src="${e.target.result}" alt="preview"><div class="remove-btn" onclick="this.parentElement.remove()">&times;</div>`;
      preview.appendChild(div);
    };
    reader.readAsDataURL(file);
  });
}

function handleSubmit(e){
  e.preventDefault();
  alert('Project saved successfully!');
  window.location.href='list.html';
  return false;
}
</script>
</body>
</html>
